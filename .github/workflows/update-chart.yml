name: Update KaanChart indicators

on:
  schedule:
    - cron: "7 0 * * *"   # daily at 00:07 UTC, just after the daily candle closes
  workflow_dispatch: {}    # allows a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-chart
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install matplotlib
        run: pip install matplotlib==3.9.2

      - name: Draw chart and indicators
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: python scripts/kaanchart.py assets/btc-1h.png data/kaanchart.json README.md

      - name: Commit chart
        run: |
          git config user.name "kaanchart-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/btc-1h.png data/kaanchart.json README.md
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Daily chart update $(date -u +'%Y-%m-%d')"
            git push
          fi
